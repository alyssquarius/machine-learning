<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVibe - Lupa Password</title>
    <link rel="stylesheet" href="css/output.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen w-full flex bg-white overflow-hidden">

    <!-- Left side (~50%): Form -->
    <div class="w-full lg:w-1/2 flex flex-col relative h-full">
        <!-- Logo -->
        <div class="absolute top-8 left-8 lg:top-12 lg:left-12 flex items-center gap-2">
            <div class="p-2 bg-black text-white rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 002 12v4c0 .6.4 1 1 1h2m14 0a2 2 0 11-4 0 2 2 0 014 0zm-10 0a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <span class="text-xl font-bold text-black tracking-tight">AutoVibe</span>
        </div>

        <!-- Form Container -->
        <div class="flex-1 flex items-center justify-center p-8">
            <div class="w-full max-w-md">
                <h1 class="text-4xl font-bold text-black mb-3">Lupa Password?</h1>
                <p class="text-gray-500 mb-8">Masukkan email dan kami kirimkan tautan reset.</p>

                <form id="forgot-form" novalidate class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required 
                            class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors" 
                            placeholder="nama@email.com">
                    </div>

                    <!-- Alert message -->
                    <div id="form-message" class="hidden text-sm rounded-lg p-3 bg-red-50 text-red-600 border border-red-200" role="alert"></div>

                    <button id="submit-btn" type="submit" 
                        class="w-full bg-black text-white rounded-lg py-3 font-medium hover:bg-gray-800 transition-colors">
                        Kirim Tautan Reset
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <a href="index.html" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-black transition-colors">
                        <span class="mr-2">←</span>
                        Kembali ke login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Right side (~50%): Image Cover -->
    <div class="hidden lg:block lg:w-1/2 p-3 h-full">
        <div class="w-full h-full rounded-2xl overflow-hidden relative">
            <img src="images/car-hero.jpg" alt="Luxury Car" class="w-full h-full object-cover">
            
            <!-- Bottom Quote Overlay -->
            <div class="absolute bottom-0 left-0 right-0 p-12 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-white">
                <p class="text-2xl font-medium mb-4 leading-relaxed">
                    "Proses reset password sangat cepat dan mudah. Keamanan akun selalu terjaga."
                </p>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gray-500 flex items-center justify-center text-white font-bold">BS</div>
                    <div>
                        <p class="font-bold">Budi Santoso</p>
                        <p class="text-sm text-gray-300">Pengguna AutoVibe</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
