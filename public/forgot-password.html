<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVibe - Lupa Password</title>
    <link rel="stylesheet" href="css/output.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations & glassmorphism */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes pulse-blob {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
        .blob-anim {
            animation: pulse-blob 8s ease-in-out infinite;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.15);
        }
        .bg-gradient-sky {
            background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 50%, #BAE6FD 100%);
        }
    </style>
</head>
<body class="bg-gradient-sky min-h-screen flex items-center justify-center p-4 lg:p-8 font-sans overflow-hidden relative">

    <!-- Floating Background Shapes -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-[#7DD3FC] rounded-full mix-blend-multiply filter blur-3xl opacity-60 blob-anim"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-[#38BDF8] rounded-full mix-blend-multiply filter blur-3xl opacity-50 blob-anim" style="animation-delay: 2s;"></div>
    <div class="absolute top-[20%] right-[10%] w-72 h-72 bg-[#87CEEB] rounded-full mix-blend-multiply filter blur-3xl opacity-60 blob-anim" style="animation-delay: 4s;"></div>

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-0 rounded-[2.5rem] overflow-hidden glass-card z-10 min-h-[600px]">
        
        <!-- Left Panel: Branding & Illustration -->
        <div class="hidden lg:flex flex-col justify-between p-12 bg-gradient-to-br from-[#0EA5E9] to-[#38BDF8] relative overflow-hidden text-white">
            <!-- Decorative glass overlay -->
            <div class="absolute inset-0 bg-white/10 backdrop-blur-sm z-0"></div>
            
            <div class="relative z-10 flex items-center gap-3">
                <div class="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 002 12v4c0 .6.4 1 1 1h2m14 0a2 2 0 11-4 0 2 2 0 014 0zm-10 0a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <span class="text-3xl font-bold tracking-tight">AutoVibe</span>
            </div>

            <div class="relative z-10 flex-grow flex flex-col justify-center my-12">
                <div class="float-anim mb-8">
                    <!-- SVG Car Illustration -->
                    <svg class="w-full max-w-md mx-auto" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 180H350" stroke="white" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 15" opacity="0.5"/>
                        <path d="M80 150 L100 90 C105 75 120 65 135 65 H245 C260 65 275 75 280 90 L310 150" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="6" stroke-linejoin="round"/>
                        <path d="M50 150 H330 C345 150 355 160 355 175 V180 C355 195 345 205 330 205 H50 C35 205 25 195 25 180 V175 C25 160 35 150 50 150 Z" fill="white"/>
                        <circle cx="100" cy="195" r="25" fill="#0EA5E9" stroke="white" stroke-width="8"/>
                        <circle cx="280" cy="195" r="25" fill="#0EA5E9" stroke="white" stroke-width="8"/>
                        <path d="M120 90 H260 V120 H120 V90 Z" fill="rgba(255,255,255,0.5)" rx="10"/>
                        <path d="M330 165 H345" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
                        <path d="M60 165 H75" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2 class="text-4xl font-extrabold leading-tight mb-4">Kembali Ke Jalan!</h2>
                <p class="text-white/80 text-lg max-w-md">Lupa kunci? Jangan khawatir. Kami akan membantu Anda kembali ke kursi pengemudi di AutoVibe.</p>
            </div>
        </div>

        <!-- Right Panel: Form -->
        <div class="p-8 lg:p-14 flex flex-col justify-center bg-white/60">
            
            <div class="lg:hidden flex items-center gap-2 mb-8 text-[#0EA5E9]">
                <div class="p-2 bg-[#E0F2FE] rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 002 12v4c0 .6.4 1 1 1h2m14 0a2 2 0 11-4 0 2 2 0 014 0zm-10 0a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <span class="text-2xl font-bold">AutoVibe</span>
            </div>

            <div class="max-w-md w-full mx-auto">
                <div class="mb-10 text-center lg:text-left">
                    <h1 class="text-3xl font-extrabold text-gray-900 mb-3">Lupa password?</h1>
                    <p class="text-gray-500">Masukkan email Anda dan kami kirimkan tautan untuk mengatur ulang password.</p>
                </div>

                <form id="forgot-form" novalidate class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                                </svg>
                            </div>
                            <input id="email" name="email" type="email" autocomplete="email" required 
                                class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-200 rounded-2xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-[#BAE6FD] focus:border-[#0EA5E9] transition-all duration-300" 
                                placeholder="nama@email.com">
                        </div>
                    </div>

                    <!-- Alert message -->
                    <p id="form-message" class="hidden text-sm rounded-xl p-4 bg-red-50 text-red-600 border border-red-100" role="alert"></p>

                    <button id="submit-btn" type="submit" 
                        class="w-full flex justify-center items-center gap-2 py-3.5 px-4 bg-gradient-to-r from-[#0EA5E9] to-[#38BDF8] hover:from-[#0284C7] hover:to-[#0EA5E9] text-white rounded-2xl font-bold text-lg shadow-lg shadow-[#BAE6FD] hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                        Kirim tautan reset
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <a href="index.html" class="inline-flex items-center text-sm font-semibold text-gray-500 hover:text-[#0EA5E9] transition-colors group">
                        <span class="mr-2 transform group-hover:-translate-x-1 transition-transform">←</span>
                        Kembali ke login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
