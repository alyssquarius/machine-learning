<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AutoVibe</title>
    <link rel="stylesheet" href="css/output.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F0F9FF;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Animated Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #87CEEB;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: #7DD3FC;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation-delay: -5s;
        }

        .blob-3 {
            top: 40%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: #0EA5E9;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
            opacity: 0.4;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(30px, 50px) rotate(10deg);
            }
        }

        .input-field {
            transition: all 0.3s ease;
        }
        
        .input-field:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15), 0 8px 10px -6px rgba(14, 165, 233, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #38BDF8, #0EA5E9);
            background-size: 200% 200%;
            transition: all 0.4s ease;
        }

        .btn-primary:hover {
            background-position: 100% 50%;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px #0EA5E9;
        }

        .floating-car {
            animation: driveFloat 6s ease-in-out infinite;
        }

        @keyframes driveFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 relative">

    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Container -->
    <div class="w-full max-w-5xl rounded-3xl overflow-hidden glass-panel flex flex-col md:flex-row shadow-[0_8px_32px_0_rgba(14,165,233,0.1)]">
        
        <!-- Left Panel: Illustration -->
        <div class="w-full md:w-5/12 bg-gradient-to-br from-[#0EA5E9] to-[#38BDF8] p-10 text-white flex flex-col justify-between relative overflow-hidden hidden md:flex">
            <!-- Decorative circles -->
            <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 bg-[#7DD3FC] opacity-20 rounded-full blur-2xl transform -translate-x-1/2 translate-y-1/2"></div>
            
            <div class="relative z-10">
                <a href="index.html" class="flex items-center gap-2 text-white font-bold text-2xl tracking-tight mb-2">
                    <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 16H9m10 0h3v-3.15a1 1 0 00-.84-.99L16 11l-2.7-3.6a2 2 0 00-1.6-.8H8.3a2 2 0 00-1.6.8L4 11l-5.16.86a1 1 0 00-.84.99V16h3m10 0a2 2 0 10-4 0m4 0a2 2 0 11-4 0m-6 0a2 2 0 10-4 0m4 0a2 2 0 11-4 0"/>
                    </svg>
                    AutoVibe
                </a>
                <p class="text-[#E0F2FE] font-medium text-sm">Your Ride. Your Vibe.</p>
            </div>

            <div class="relative z-10 flex-1 flex flex-col items-center justify-center mt-8">
                <!-- SVG Car Illustration -->
                <div class="floating-car w-full max-w-[280px]">
                    <svg viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Car Shadow -->
                        <ellipse cx="150" cy="170" rx="120" ry="15" fill="black" fill-opacity="0.15"/>
                        <!-- Car Body Bottom -->
                        <path d="M30 140 C 30 140, 15 140, 15 125 C 15 110, 20 100, 40 90 L 80 90 L 95 60 C 105 40, 130 35, 160 35 L 180 35 C 210 35, 230 45, 245 70 L 265 90 C 275 90, 285 95, 285 110 C 285 125, 290 140, 270 140 Z" fill="white"/>
                        <!-- Car Windows -->
                        <path d="M100 62 C 105 50, 120 42, 140 42 L 155 42 L 155 88 L 85 88 Z" fill="#E0F2FE"/>
                        <path d="M162 42 L 175 42 C 195 42, 210 50, 225 65 L 240 88 L 162 88 Z" fill="#E0F2FE"/>
                        <!-- Car Accents -->
                        <rect x="250" y="105" width="20" height="8" rx="4" fill="#FCA5A5"/> <!-- Taillight -->
                        <rect x="25" y="105" width="25" height="12" rx="6" fill="#FDE047"/> <!-- Headlight -->
                        <path d="M40 95 L 100 95" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
                        <!-- Wheels -->
                        <circle cx="75" cy="140" r="25" fill="#334155"/>
                        <circle cx="75" cy="140" r="12" fill="#CBD5E1"/>
                        <circle cx="225" cy="140" r="25" fill="#334155"/>
                        <circle cx="225" cy="140" r="12" fill="#CBD5E1"/>
                        <!-- Speed Lines -->
                        <path d="M-10 110 L 20 110" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8" stroke-dasharray="10 10"/>
                        <path d="M0 130 L 40 130" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="15 15"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mt-6 text-center">Secure Your Ride</h2>
                <p class="text-center text-[#E0F2FE] mt-3 text-sm leading-relaxed max-w-[250px]">
                    Let's get your account back on track. A secure password keeps your dream cars safe.
                </p>
            </div>
        </div>

        <!-- Right Panel: Form -->
        <div class="w-full md:w-7/12 p-8 md:p-14 bg-white/40 flex flex-col justify-center relative">
            <!-- Mobile Brand Header -->
            <div class="flex items-center gap-2 md:hidden mb-8 text-[#0EA5E9] font-bold text-2xl tracking-tight">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 16H9m10 0h3v-3.15a1 1 0 00-.84-.99L16 11l-2.7-3.6a2 2 0 00-1.6-.8H8.3a2 2 0 00-1.6.8L4 11l-5.16.86a1 1 0 00-.84.99V16h3m10 0a2 2 0 10-4 0m4 0a2 2 0 11-4 0m-6 0a2 2 0 10-4 0m4 0a2 2 0 11-4 0"/>
                </svg>
                AutoVibe
            </div>

            <div class="max-w-md w-full mx-auto">
                
                <h1 class="text-3xl md:text-4xl font-extrabold text-[#0F172A] mb-2 tracking-tight">Atur password baru</h1>
                <p class="text-[#64748B] mb-8">Masukkan password baru untuk akun Anda.</p>

                <p id="checking" class="text-[#0EA5E9] font-medium flex items-center gap-2">
                    <svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Memeriksa tautan...
                </p>

                <form id="reset-form" class="hidden space-y-6" novalidate>
                    <div class="space-y-5">
                        <!-- Password Field -->
                        <div class="input-field group relative">
                            <label for="password" class="block text-sm font-semibold text-[#334155] mb-1.5 ml-1">Password Baru</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#94A3B8] group-focus-within:text-[#0EA5E9] transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                    </svg>
                                </div>
                                <input id="password" name="password" type="password" autocomplete="new-password" required
                                    class="w-full pl-11 pr-12 py-3.5 bg-white/60 border-2 border-[#E2E8F0] rounded-2xl text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-[#38BDF8] focus:bg-white transition-all shadow-sm"
                                    placeholder="Min. 8 karakter">
                                <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-[#94A3B8] hover:text-[#0EA5E9] transition-colors focus:outline-none">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password Field -->
                        <div class="input-field group relative">
                            <label for="confirm" class="block text-sm font-semibold text-[#334155] mb-1.5 ml-1">Konfirmasi Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#94A3B8] group-focus-within:text-[#0EA5E9] transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                                    </svg>
                                </div>
                                <input id="confirm" name="confirm" type="password" autocomplete="new-password" required
                                    class="w-full pl-11 pr-12 py-3.5 bg-white/60 border-2 border-[#E2E8F0] rounded-2xl text-[#0F172A] placeholder-[#94A3B8] outline-none focus:border-[#38BDF8] focus:bg-white transition-all shadow-sm"
                                    placeholder="Ulangi password baru">
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button id="submit-btn" type="submit" class="btn-primary w-full py-4 rounded-2xl text-white font-bold text-[15px] shadow-lg flex justify-center items-center gap-2">
                            <span>Simpan password</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="mt-5 text-center">
                        <p id="form-message" class="hidden text-sm font-medium p-4 rounded-xl" role="alert"></p>
                    </div>
                </form>

                <div class="mt-8 text-center">
                    <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#64748B] hover:text-[#0EA5E9] transition-colors group">
                        <span class="group-hover:-translate-x-1 transition-transform">←</span>
                        Kembali ke login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
