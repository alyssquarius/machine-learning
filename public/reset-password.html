        (function() {
            var savedTheme = localStorage.getItem('theme');
            var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);

                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

<body class="min-h-screen bg-white dark:bg-zinc-950 text-gray-900 dark:text-zinc-100">
    <div class="flex min-h-screen">
        <!-- Left Side: Form -->
        <div class="w-full lg:w-1/2 flex flex-col p-8 relative bg-white dark:bg-zinc-950">
            <!-- Header: Logo & Theme Toggle -->
            <div class="flex items-center justify-between mb-12">
                <a href="index.html" class="flex items-center gap-2 text-black dark:text-white font-bold text-2xl tracking-tight">
                    <svg class="w-7 h-7 text-black dark:text-white" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.28l1.08 3.11H5.77L6.85 7zM7.5 16c-.83 0-1.5-.67-1.5-1.5S6.67 13 7.5 13s1.5.67 1.5 1.5S8.33 16 7.5 16zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                    </svg>
                    AutoBuyCars
                </a>

                <!-- Theme Toggle Button -->
                <button type="button" data-theme-toggle class="theme-toggle-btn border border-gray-200 dark:border-zinc-800 rounded-lg p-2 hover:bg-gray-100 dark:hover:bg-zinc-800 transition" aria-label="Ganti mode tema" title="Ganti mode tema">
                    <svg data-theme-icon="sun" class="w-5 h-5 hidden text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg data-theme-icon="moon" class="w-5 h-5 text-gray-600 dark:text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>

            <!-- Main Content -->
            <div class="flex-1 flex flex-col justify-center max-w-md w-full mx-auto">
                <h1 class="text-4xl font-bold text-black dark:text-white mb-2">Atur Password Baru</h1>
                <p class="text-gray-500 dark:text-zinc-400 mb-8">Masukkan password baru untuk akun Anda.</p>

                <div id="checking" class="flex items-center gap-2 text-gray-600 dark:text-zinc-400 mb-6">
                    <svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Memeriksa tautan...</span>
                </div>

                <form id="reset-form" class="hidden space-y-5" novalidate>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-zinc-300 mb-1">Password Baru</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="new-password" required
                                class="w-full border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white rounded-lg py-3 px-4 focus:outline-none focus:border-black dark:focus:border-white focus:ring-1 focus:ring-black dark:focus:ring-white transition-colors"
                                placeholder="Min. 8 karakter">
                            <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="confirm" class="block text-sm font-medium text-gray-700 dark:text-zinc-300 mb-1">Konfirmasi Password</label>
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required
                            class="w-full border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-gray-900 dark:text-white rounded-lg py-3 px-4 focus:outline-none focus:border-black dark:focus:border-white focus:ring-1 focus:ring-black dark:focus:ring-white transition-colors"
                            placeholder="Ulangi password baru">
                    </div>

                    <p id="form-message" class="hidden text-sm font-medium rounded-lg p-3"></p>

                    <button id="submit-btn" type="submit" class="w-full bg-black dark:bg-white text-white dark:text-zinc-950 rounded-lg py-3 font-medium hover:bg-gray-800 dark:hover:bg-zinc-200 transition-colors">
                        Simpan Password
                    </button>
                </form>

                <div class="mt-8">
                    <a href="index.html" class="inline-flex items-center text-sm font-medium text-gray-500 dark:text-zinc-400 hover:text-black dark:hover:text-white transition-colors">
                        <span class="mr-2">←</span> Kembali ke login
                    </a>
                </div>
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="hidden lg:block lg:w-1/2 p-3 bg-white dark:bg-zinc-950">
            <div class="w-full h-full rounded-2xl overflow-hidden relative">
                <img src="images/car-hero.jpg" alt="AutoBuyCars Security" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-linear-to-t from-black/80 via-black/20 to-transparent"></div>
                <div class="absolute bottom-0 left-0 right-0 p-12 text-white">
                    <p class="text-xl font-medium leading-relaxed mb-4">"Keamanan akun adalah prioritas kami. Password baru Anda akan terlindungi dengan enkripsi terbaik."</p>
                    <div>
                        <p class="font-semibold">Tim AutoBuyCars</p>
                        <p class="text-gray-300 text-sm">Security Team</p>
                    </div>
                </div>
            </div>
        </div>
