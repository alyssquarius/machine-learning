<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AutoVibe</title>
    <link rel="stylesheet" href="css/output.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-white text-gray-900">
    <div class="flex min-h-screen">
        <!-- Left Side: Form -->
        <div class="w-full lg:w-1/2 flex flex-col p-8 relative">
            <!-- Logo -->
            <div class="mb-12">
                <a href="index.html" class="flex items-center gap-2 text-black font-bold text-2xl tracking-tight">
                    <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 16H9m10 0h3v-3.15a1 1 0 00-.84-.99L16 11l-2.7-3.6a2 2 0 00-1.6-.8H8.3a2 2 0 00-1.6.8L4 11l-5.16.86a1 1 0 00-.84.99V16h3m10 0a2 2 0 10-4 0m4 0a2 2 0 11-4 0m-6 0a2 2 0 10-4 0m4 0a2 2 0 11-4 0"/>
                    </svg>
                    AutoVibe
                </a>
            </div>

            <!-- Main Content -->
            <div class="flex-1 flex flex-col justify-center max-w-md w-full mx-auto">
                <h1 class="text-4xl font-bold text-black mb-2">Atur Password Baru</h1>
                <p class="text-gray-500 mb-8">Masukkan password baru untuk akun Anda.</p>

                <div id="checking" class="flex items-center gap-2 text-gray-600 mb-6">
                    <svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Memeriksa tautan...</span>
                </div>

                <form id="reset-form" class="hidden space-y-5" novalidate>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="new-password" required
                                class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                                placeholder="Min. 8 karakter">
                            <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password</label>
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required
                            class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                            placeholder="Ulangi password baru">
                    </div>

                    <p id="form-message" class="hidden text-sm font-medium rounded-lg p-3"></p>

                    <button id="submit-btn" type="submit" class="w-full bg-black text-white rounded-lg py-3 font-medium hover:bg-gray-800 transition-colors">
                        Simpan Password
                    </button>
                </form>

                <div class="mt-8">
                    <a href="index.html" class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-black transition-colors">
                        <span class="mr-2">←</span> Kembali ke login
                    </a>
                </div>
            </div>
        </div>

        <!-- Right Side: Image -->
        <div class="hidden lg:block lg:w-1/2 p-3">
            <div class="w-full h-full rounded-2xl overflow-hidden relative">
                <img src="images/car-hero.jpg" alt="AutoVibe Security" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                <div class="absolute bottom-0 left-0 right-0 p-12 text-white">
                    <p class="text-xl font-medium leading-relaxed mb-4">"Keamanan akun adalah prioritas kami. Password baru Anda akan terlindungi dengan enkripsi terbaik."</p>
                    <div>
                        <p class="font-semibold">Tim AutoVibe</p>
                        <p class="text-gray-300 text-sm">Security Team</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
