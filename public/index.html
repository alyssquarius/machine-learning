<body class="min-h-screen flex flex-col md:flex-row bg-white overflow-hidden">
    <!-- Left Panel: Minimal Form -->
    <div class="w-full md:w-1/2 flex flex-col min-h-screen p-8 lg:p-12 xl:p-20 relative bg-white">
        <!-- Logo -->
        <div class="flex items-center gap-2 mb-auto">
            <svg class="w-8 h-8 text-black" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.28l1.08 3.11H5.77L6.85 7zM7.5 16c-.83 0-1.5-.67-1.5-1.5S6.67 13 7.5 13s1.5.67 1.5 1.5S8.33 16 7.5 16zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
            </svg>
            <span class="text-xl font-bold tracking-tight text-black">AutoBuyCars</span>
        </div>

        <!-- Main Form Content -->
        <div class="w-full max-w-sm mx-auto my-auto py-12">
            <h1 class="text-3xl font-bold text-black mb-2">Selamat Datang Kembali</h1>
            <p class="text-gray-500 mb-8">Masuk untuk melanjutkan ke AutoBuyCars</p>

            <!-- Form Message -->
            <p id="form-message" class="hidden p-4 mb-6 rounded-lg text-sm font-medium border" role="alert"></p>

            <form id="login-form" novalidate class="space-y-5">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                        placeholder="nama@email.com">
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <a href="forgot-password.html" class="text-sm font-medium text-black hover:underline">Lupa sandi?</a>
                    </div>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="w-full border border-gray-300 rounded-lg py-3 px-4 pr-12 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                            placeholder="••••••••">
                        <button type="button" data-toggle-password="password"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button id="submit-btn" type="submit"
                    class="w-full bg-black text-white rounded-lg py-3 font-medium hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black mt-2">
                    Masuk
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-3 bg-white text-gray-500">atau</span>
                </div>
            </div>

            <!-- Google Login -->
            <button id="google-login" type="button"
                class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg py-3 bg-white hover:bg-gray-50 transition-colors font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200">
                <svg class="h-5 w-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Masuk dengan Google
            </button>
            
            <p class="mt-8 text-center text-sm text-gray-600">
                Belum punya akun? 
                <a href="register.html" class="font-medium text-black hover:underline">Daftar sekarang</a>
            </p>
        </div>
        
        <!-- Bottom padding spacer to balance top logo if needed -->
        <div class="mt-auto hidden md:block"></div>
    </div>

    <!-- Right Panel: Image -->
    <div class="hidden md:block md:w-1/2 p-3 min-h-screen">
        <div class="w-full h-full rounded-2xl overflow-hidden relative">
            <img src="images/car-hero.jpg" alt="AutoBuyCars Hero" class="absolute inset-0 w-full h-full object-cover" />
            
            <!-- Dark Gradient Overlay -->
            <div class="absolute inset-0 bg-linear-to-t from-black/80 via-black/20 to-transparent"></div>
            
            <!-- Testimonial Overlay -->
            <div class="absolute bottom-0 left-0 right-0 p-10 lg:p-14 text-white">
                <blockquote class="text-xl lg:text-2xl font-medium leading-relaxed mb-6">
                    "Temukan mobil impianmu dengan mudah dan cepat. AutoBuyCars memberikan pengalaman terbaik dalam jual beli mobil."
                </blockquote>
                <div class="flex items-center gap-4">
                    <!-- <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-lg font-bold backdrop-blur-sm border border-white/30">
                        AR
                    </div> -->
                    <div>
                        <!-- <div class="font-bold text-white text-lg">Ahmad Rizki</div>
                        <div class="text-gray-300 text-sm">Pengguna AutoBuyCars</div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Required Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
</body>
