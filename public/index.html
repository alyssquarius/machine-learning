<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - AutoVibe</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/output.css" />
    <style>
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float 7s ease-in-out infinite;
            animation-delay: 2s;
        }
        .animate-blob {
            animation: blob 10s infinite alternate;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
        }
        .bg-sky-gradient {
            background: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 100%);
        }
    </style>
</head>
<body class="min-h-screen bg-sky-50 flex items-center justify-center p-4 md:p-8 font-sans antialiased overflow-hidden relative">
    
    <!-- Animated Background Blobs -->
    <div class="absolute top-0 left-0 w-96 h-96 bg-sky-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 right-0 w-96 h-96 bg-sky-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style="animation-delay: 2s;"></div>
    <div class="absolute -bottom-32 left-1/2 w-96 h-96 bg-sky-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style="animation-delay: 4s;"></div>

    <!-- Main Container -->
    <div class="max-w-6xl w-full bg-white/40 backdrop-blur-xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative z-10 border border-white/60">
        
        <!-- Left Panel: Branding & Illustration -->
        <div class="w-full md:w-1/2 bg-sky-gradient p-10 md:p-16 text-white flex flex-col justify-between relative overflow-hidden">
            <!-- Decorative circles -->
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute bottom-0 right-0 w-80 h-80 bg-sky-600/20 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <!-- Brand -->
                <div class="flex items-center gap-3 mb-12">
                    <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.28l1.08 3.11H5.77L6.85 7zM7.5 16c-.83 0-1.5-.67-1.5-1.5S6.67 13 7.5 13s1.5.67 1.5 1.5S8.33 16 7.5 16zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                    </svg>
                    <span class="text-3xl font-extrabold tracking-tight">AutoVibe</span>
                </div>

                <!-- Headline -->
                <h1 class="text-4xl lg:text-5xl font-bold leading-tight mb-6">
                    Temukan mobil impianmu dengan mudah
                </h1>

                <!-- Benefits -->
                <ul class="space-y-4 mb-12">
                    <li class="flex items-center gap-3 text-sky-50 text-lg">
                        <div class="bg-white/20 p-1.5 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        Ribuan pilihan mobil berkualitas
                    </li>
                    <li class="flex items-center gap-3 text-sky-50 text-lg">
                        <div class="bg-white/20 p-1.5 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        Harga transparan & bersaing
                    </li>
                    <li class="flex items-center gap-3 text-sky-50 text-lg">
                        <div class="bg-white/20 p-1.5 rounded-full">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        Proses aman dan terpercaya
                    </li>
                </ul>
            </div>

            <!-- Modern Car SVG Illustration -->
            <div class="relative h-48 mt-auto z-10 animate-float">
                <svg viewBox="0 0 400 200" class="w-full h-full drop-shadow-2xl" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Geometric floating shapes -->
                    <circle cx="350" cy="40" r="15" fill="white" fill-opacity="0.2" class="animate-float-delayed"/>
                    <rect x="40" y="20" width="20" height="20" rx="4" fill="white" fill-opacity="0.3" class="animate-float" style="animation-delay: 1s;"/>
                    <polygon points="200,10 215,30 185,30" fill="white" fill-opacity="0.15" class="animate-float-delayed" style="animation-delay: 3s;"/>
                    
                    <!-- Car Silhouette -->
                    <!-- Wheels -->
                    <circle cx="110" cy="150" r="25" fill="#0F172A" />
                    <circle cx="110" cy="150" r="12" fill="#E2E8F0" />
                    <circle cx="290" cy="150" r="25" fill="#0F172A" />
                    <circle cx="290" cy="150" r="12" fill="#E2E8F0" />
                    
                    <!-- Car Body -->
                    <path d="M 60 145 C 50 145 40 135 40 120 C 40 100 50 90 70 85 L 120 75 C 130 60 150 45 180 40 L 250 40 C 280 45 300 65 310 85 L 350 95 C 365 100 370 115 370 130 C 370 145 360 145 350 145 L 320 145 A 30 30 0 0 0 260 145 L 140 145 A 30 30 0 0 0 80 145 Z" fill="#F8FAFC" />
                    
                    <!-- Windows -->
                    <path d="M 130 75 C 140 65 155 52 180 50 L 220 50 L 210 80 L 120 80 Z" fill="#94A3B8" fill-opacity="0.3" />
                    <path d="M 230 50 L 250 50 C 270 52 285 65 295 80 L 220 80 Z" fill="#94A3B8" fill-opacity="0.3" />
                    
                    <!-- Headlight/Taillight -->
                    <path d="M 350 100 L 365 105 L 365 115 L 355 115 Z" fill="#FCD34D" />
                    <path d="M 45 105 L 55 100 L 55 115 L 45 115 Z" fill="#EF4444" />
                    
                    <!-- Lines/Details -->
                    <path d="M 70 110 L 340 110" stroke="#E2E8F0" stroke-width="2" />
                </svg>
            </div>
        </div>

        <!-- Right Panel: Login Form -->
        <div class="w-full md:w-1/2 p-8 md:p-16 flex flex-col justify-center bg-white/80 glass-panel">
            <div class="w-full max-w-md mx-auto">
                <div class="text-center mb-10">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang Kembali</h2>
                    <p class="text-gray-500">Masuk untuk melanjutkan ke AutoVibe</p>
                </div>

                <!-- Form Message -->
                <p id="form-message" class="hidden p-4 mb-6 rounded-xl text-sm font-medium" role="alert"></p>

                <form id="login-form" novalidate class="space-y-6">
                    <!-- Email -->
                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                                </svg>
                            </div>
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="w-full pl-10 pr-4 py-3.5 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-transparent transition-all outline-none text-gray-800 placeholder-gray-400"
                                placeholder="nama@email.com">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
                            <a href="forgot-password.html" class="text-sm font-semibold text-sky-500 hover:text-sky-600 transition-colors">Lupa password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <input id="password" name="password" type="password" autocomplete="current-password" required
                                class="w-full pl-10 pr-12 py-3.5 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-transparent transition-all outline-none text-gray-800 placeholder-gray-400"
                                placeholder="••••••••">
                            <button type="button" data-toggle-password="password"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-sky-500 transition-colors focus:outline-none">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button id="submit-btn" type="submit"
                        class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white font-bold rounded-xl shadow-lg shadow-sky-500/30 transform transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                        Masuk
                    </button>
                </form>

                <!-- Divider -->
                <div class="mt-8 relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-transparent text-gray-500">Atau masuk dengan</span>
                    </div>
                </div>

                <!-- Google Login -->
                <div class="mt-8">
                    <button id="google-login" type="button"
                        class="w-full flex items-center justify-center gap-3 py-3.5 px-4 bg-white/80 border border-gray-200 rounded-xl text-gray-700 font-semibold hover:bg-gray-50 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 backdrop-blur-sm">
                        <svg class="h-5 w-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                </div>

                <p class="mt-10 text-center text-sm text-gray-600">
                    Belum punya akun? 
                    <a href="register.html" class="font-bold text-sky-500 hover:text-sky-600 transition-colors">Daftar sekarang</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Required Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
