<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVibe - Register</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/output.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            overflow-x: hidden;
        }

        /* Strength bar styles for JS */
        .strength-weak { background-color: #ef4444 !important; }
        .strength-fair { background-color: #f59e0b !important; }
        .strength-good { background-color: #3b82f6 !important; }
        .strength-strong { background-color: #10b981 !important; }
    </style>
</head>
<body class="min-h-screen flex w-full">

    <!-- Left side: Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center p-8 sm:p-12 lg:p-16 xl:p-24 bg-white relative">
        
        <!-- Logo -->
        <a href="/" class="absolute top-8 left-8 sm:top-12 sm:left-12 lg:left-16 flex items-center gap-2 text-black mb-12 w-max">
            <svg class="w-7 h-7 text-black" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.28l1.08 3.11H5.77L6.85 7zM7.5 16c-.83 0-1.5-.67-1.5-1.5S6.67 13 7.5 13s1.5.67 1.5 1.5S8.33 16 7.5 16zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
            </svg>
            <span class="text-xl font-bold tracking-tight">AutoVibe</span>
        </a>

        <div class="max-w-md w-full mx-auto mt-16 sm:mt-0">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-black mb-2">Buat Akun Baru</h1>
                <p class="text-gray-500 text-sm">Lengkapi form di bawah untuk mulai jual beli mobil.</p>
            </div>

            <form id="register-form" novalidate class="space-y-5">
                
                <!-- Full Name -->
                <div>
                    <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input id="full_name" name="full_name" type="text" autocomplete="name" required
                        class="w-full border border-gray-300 rounded-lg py-3 px-4 text-base focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                        placeholder="Auto Enthusiast">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="w-full border border-gray-300 rounded-lg py-3 px-4 text-base focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                        placeholder="nama@email.com">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="new-password" required
                            class="w-full border border-gray-300 rounded-lg py-3 pl-4 pr-12 text-base focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                            placeholder="Min. 8 karakter">
                        <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Password Strength -->
                    <div class="mt-2">
                        <div id="strength" class="flex gap-2 h-1 w-full">
                            <span class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></span>
                            <span class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></span>
                            <span class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></span>
                            <span class="h-1 flex-1 rounded-full bg-gray-200 transition-colors duration-300"></span>
                        </div>
                        <p id="strength-text" class="text-xs text-gray-500 mt-1.5 font-medium"></p>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password</label>
                    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required
                        class="w-full border border-gray-300 rounded-lg py-3 px-4 text-base focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors"
                        placeholder="Ulangi password Anda">
                </div>

                <!-- Form Message -->
                <p id="form-message" class="hidden rounded-lg p-3 text-sm font-medium border" role="alert"></p>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button id="submit-btn" type="submit" 
                        class="w-full bg-black text-white font-semibold py-3 px-4 rounded-lg shadow-sm hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black">
                        Daftar Sekarang
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Sudah punya akun? 
                    <a href="index.html" class="text-black font-semibold hover:underline">
                        Login di sini
                    </a>
                </p>
            </div>
            
        </div>
    </div>

    <!-- Right side: Image Panel -->
    <div class="hidden lg:block lg:w-1/2 p-3 bg-white">
        <div class="relative w-full h-full rounded-2xl overflow-hidden bg-gray-900">
            <!-- Background Image -->
            <img src="images/car-hero.jpg" alt="Car Background" class="absolute inset-0 w-full h-full object-cover opacity-90" />
            
            <!-- Bottom Overlay / Testimonial -->
            <div class="absolute inset-0 bg-linear-to-t from-black/80 via-black/20 to-transparent"></div>
            
            <div class="absolute bottom-0 left-0 right-0 p-12 text-white">
                <blockquote class="text-2xl font-medium leading-relaxed mb-6">
                    "Platform jual beli mobil paling mudah dan terpercaya yang pernah saya gunakan."
                </blockquote>
                <div>
                    <p class="font-semibold text-lg">Siti Nurhaliza</p>
                    <p class="text-gray-300 text-sm">Member AutoVibe</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
